[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "woomba"
version = "0.1.0"
description = "Private local Mac studio for editing your own adult videos"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "typer>=0.12.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "httpx>=0.27.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.24.0",
]

[project.scripts]
woomba = "woomba_cli.main:app"

[tool.setuptools.packages.find]
where = ["packages/core", "apps/api", "apps/cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["packages/core", "apps/api", "apps/cli"]
asyncio_default_fixture_loop_scope = "function"
